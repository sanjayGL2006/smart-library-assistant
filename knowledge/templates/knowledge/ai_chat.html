{% extends "base.html" %}

{% block content %}
<style>
  .chat-container {
    max-width: 800px;
    margin: 0 auto;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    height: 80vh;
  }
  .chat-header {
    padding: 1rem;
    border-bottom: 1px solid #ddd;
    background: #f8f9fa;
    border-radius: 8px 8px 0 0;
  }
  .mode-selector {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding-bottom: 0.5rem;
  }
  .mode-btn {
    background: #e9ecef;
    border: none;
    border-radius: 16px;
    padding: 0.25rem 0.75rem;
    cursor: pointer;
    font-size: 0.9rem;
    white-space: nowrap;
  }
  .mode-btn:hover {
    background: #ced4da;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .message {
    max-width: 80%;
    padding: 1rem;
    border-radius: 8px;
  }
  .message.user {
    background: #007bff;
    color: white;
    align-self: flex-end;
  }
  .message.ai {
    background: #f1f3f5;
    color: black;
    align-self: flex-start;
  }
  .chat-input-area {
    padding: 1rem;
    border-top: 1px solid #ddd;
    display: flex;
    gap: 0.5rem;
  }
  .chat-input {
    flex: 1;
    resize: none;
    padding: 0.5rem;
    border-radius: 4px;
    border: 1px solid #ccc;
    font-family: inherit;
  }
  .chat-submit {
    background: #007bff;
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    cursor: pointer;
  }
  .chat-submit:disabled {
    background: #ccc;
  }
  .typing-indicator {
    display: none;
    align-self: flex-start;
    color: #666;
    font-style: italic;
  }
</style>

<div class="chat-container">
  <div class="chat-header">
    <h3>OLMS AI</h3>
    <div class="mode-selector">
      <button class="mode-btn" onclick="setMode('/teacher ')">👨‍🏫 Teacher</button>
      <button class="mode-btn" onclick="setMode('/human ')">🧑 Human</button>
      <button class="mode-btn" onclick="setMode('/ai ')">🤖 AI</button>
      <button class="mode-btn" onclick="setMode('/code ')">💻 Code</button>
      <button class="mode-btn" onclick="setMode('/debug ')">🐛 Debug</button>
      <button class="mode-btn" onclick="setMode('/example ')">📝 Example</button>
      <button class="mode-btn" onclick="setMode('/quiz ')">❓ Quiz</button>
      <button class="mode-btn" onclick="setMode('/review ')">👀 Review</button>
      <button class="mode-btn" onclick="setMode('/research ')">🔍 Research</button>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages">
    <!-- Messages will appear here -->
  </div>
  <div class="typing-indicator" id="typingIndicator">AI is thinking...</div>

  <div class="chat-input-area">
    <textarea id="chatInput" class="chat-input" rows="1" placeholder="Type a message or use a slash command... (Shift+Enter for newline)"></textarea>
    <button id="chatSubmit" class="chat-submit" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const chatInput = document.getElementById('chatInput');
  const chatMessages = document.getElementById('chatMessages');
  const chatSubmit = document.getElementById('chatSubmit');
  const typingIndicator = document.getElementById('typingIndicator');

  function setMode(cmd) {
    chatInput.value = cmd + chatInput.value.replace(/^\/\w+\s*/, '');
    chatInput.focus();
  }

  chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  function appendMessage(content, sender, mode = null) {
    const msg = document.createElement('div');
    msg.className = 'message ' + sender;
    if (mode && sender === 'ai') {
        content = `<strong>[${mode}]</strong><br/>` + content;
    }
    msg.innerHTML = content.replace(/\n/g, '<br/>');
    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    appendMessage(text, 'user');
    chatInput.value = '';
    chatSubmit.disabled = true;
    chatInput.disabled = true;
    typingIndicator.style.display = 'block';

    fetch('/knowledge/api/ask/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken')
      },
      body: JSON.stringify({ question: text })
    })
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        appendMessage('Error: ' + data.error, 'ai');
      } else {
        appendMessage(data.answer, 'ai', data.mode_display_name);
      }
    })
    .catch(err => {
      appendMessage('Something went wrong. Please try again.', 'ai');
    })
    .finally(() => {
      chatSubmit.disabled = false;
      chatInput.disabled = false;
      typingIndicator.style.display = 'none';
      chatInput.focus();
    });
  }
</script>
{% endblock %}
